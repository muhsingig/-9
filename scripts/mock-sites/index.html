<!doctype html>
<!--
  Twelve fictional client websites, drawn with HTML/CSS/SVG only, used as the
  demo cards on the wall. Open ?site=<id> at 1440x900 to see one;
  `npm run mocks` screenshots them all into raw-shots/.
  Every brand here is invented for the template.
-->
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Mock site</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=DM+Serif+Display:ital@0;1&family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,600;1,9..144,300&family=Inter+Tight:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&family=Space+Grotesk:wght@400;500;700&family=Syne:wght@500;700;800&display=swap" rel="stylesheet" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1440px; height: 900px; overflow: hidden; }
  body { font-family: 'Inter Tight', sans-serif; -webkit-font-smoothing: antialiased; }
  .page { position: relative; width: 1440px; height: 900px; overflow: hidden; }
  nav { position: absolute; top: 0; left: 0; right: 0; display: flex; align-items: center; justify-content: space-between; padding: 34px 64px; z-index: 5; }
  nav .links { display: flex; gap: 36px; font-size: 15px; }
  .btn { display: inline-flex; align-items: center; gap: 10px; padding: 16px 26px; border-radius: 999px; font-size: 15px; font-weight: 600; }
  .small { font-size: 13px; letter-spacing: .14em; text-transform: uppercase; }
  svg { display: block; }
</style>
</head>
