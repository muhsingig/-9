<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Portfolio</title>
  <meta name="description" content="A walk-through portfolio: a tunnel of projects that opens into a gallery room." />
  <meta name="theme-color" content="#050505" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23050505'/%3E%3Crect x='7' y='10' width='18' height='12' rx='2' fill='%23e7d2ac'/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter+Tight:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="src/style.css" />
</head>
<body>
  <canvas id="gl" aria-hidden="true"></canvas>

  <div id="loader" role="status" aria-live="polite">
    <div class="loader-mark"><span class="brand-name"></span><span class="loader-pct">0</span></div>
    <div class="loader-bar"><i></i></div>
  </div>

  <header class="top">
    <a class="brand" href="#" data-jump="0"><span class="brand-dot"></span><span class="brand-name"></span><span class="brand-line"></span></a>
    <nav class="top-actions">
      <button type="button" class="nav-link" id="navAbout">About</button>
      <button type="button" class="nav-link" id="navContact">Contact</button>
      <button type="button" class="pill" id="indexToggle" aria-expanded="false" aria-controls="index">Work</button>
      <button type="button" class="pill" id="soundToggle" aria-pressed="false">Sound off</button>
    </nav>
  </header>

  <section id="hero" aria-label="Intro">
    <h1 class="hero-title"></h1>
    <p class="hero-sub"><span></span><i class="hero-arrow" aria-hidden="true">↓</i></p>
  </section>

  <aside id="caption" aria-live="polite">
    <div class="cap-num"></div>
    <div class="cap-title"></div>
    <div class="cap-body"></div>
  </aside>

  <ol id="index" aria-label="Projects"></ol>

  <article id="meta" aria-live="polite">
    <div class="meta-top"><span class="meta-kind"></span><span class="meta-num"></span></div>
    <h2 class="meta-title"></h2>
    <p class="meta-blurb"></p>
    <div class="meta-actions">
      <button type="button" class="btn btn-solid" id="stepInside">View case study <span aria-hidden="true">→</span></button>
      <a class="btn btn-ghost" id="openTab" target="_blank" rel="noopener">Live site <span aria-hidden="true">↗</span></a>
    </div>
  </article>

  <section id="about" aria-label="About">
    <figure class="about-portrait"><img alt="" /></figure>
    <div class="about-text">
      <div class="about-label">About</div>
      <h2 class="about-hello"></h2>
      <div class="about-bio"></div>
      <dl class="about-facts"></dl>
      <ul class="about-skills" aria-label="Skills"></ul>
      <div class="about-available"><i aria-hidden="true"></i><span></span></div>
    </div>
  </section>

  <section id="contact" aria-label="Contact">
    <h2 class="contact-title"></h2>
    <p class="contact-body"></p>
    <div class="contact-actions">
      <a class="btn btn-solid btn-lg contact-mail" href="#"><span></span> <i aria-hidden="true">→</i></a>
      <span class="contact-email"></span>
    </div>
    <nav class="contact-links" aria-label="Social links"></nav>
    <button type="button" class="contact-top">Back to the start ↑</button>
  </section>

  <div id="progress" aria-hidden="true"><i></i></div>

  <div id="study" role="dialog" aria-modal="true" aria-labelledby="studyTitle" hidden>
    <div class="study-scroll" data-lenis-prevent>
      <header class="study-bar">
        <span class="study-num"></span>
        <button type="button" class="pill study-close">Close ✕</button>
      </header>
      <div class="study-head">
        <div class="study-kind"></div>
        <h2 class="study-title" id="studyTitle"></h2>
        <p class="study-blurb"></p>
      </div>
      <figure class="study-figure"><img class="study-img" alt="" /></figure>
      <div class="study-body">
        <dl class="study-facts">
          <div><dt>Year</dt><dd class="study-year"></dd></div>
          <div><dt>What I did</dt><dd><ul class="study-services"></ul></dd></div>
          <div class="study-live-wrap"><dt>Live</dt><dd><a class="study-live" target="_blank" rel="noopener">Visit live site ↗</a></dd></div>
        </dl>
        <p class="study-story"></p>
      </div>
      <button type="button" class="study-next">Next project <span></span> <i aria-hidden="true">→</i></button>
    </div>
  </div>

  <div id="scroll" aria-hidden="true"></div>

  <noscript><p class="noscript">This site is a 3D walk-through and needs JavaScript.</p></noscript>
  <script type="importmap">{ "imports": { "three": "./vendor/three.module.min.js", "lenis": "./vendor/lenis.mjs", "three/addons/": "./vendor/jsm/" } }</script>
  <script type="module" src="src/main.js"></script>
</body>
</html>
